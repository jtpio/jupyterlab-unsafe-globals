[project]
name = "jupyterlab-unsafe-globals-demo"
version = "0.1.0"
description = "JupyterLite demo for jupyterlab-unsafe-globals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jupyterlab>=4.6.0",
    "jupyterlab-unsafe-globals",
    "jupyterlite-core>=0.8.0,<0.9",
    "jupyterlite-pyodide-kernel>=0.8.0,<0.9",
]

[tool.uv.sources]
jupyterlab-unsafe-globals = { path = ".." }
